apiVersion: apps/v1
kind: Deployment
metadata:
  name: masters-pool
  labels:
    app.kubernetes.io/name: masters-pool
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: masters-pool
  template:
    metadata:
      labels:
        app.kubernetes.io/name: masters-pool
    spec:
      containers:
        - name: api
          image: ghcr.io/dgunzy/masters-pool-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: masters-pool-api-config
            - secretRef:
                name: masters-pool-api-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
        - name: web
          image: ghcr.io/dgunzy/masters-pool-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          volumeMounts:
            - name: web-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
      volumes:
        - name: web-config
          configMap:
            name: masters-pool-web-config
