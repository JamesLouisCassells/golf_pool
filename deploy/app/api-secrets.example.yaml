apiVersion: v1
kind: Secret
metadata:
  name: masters-pool-api-secrets
type: Opaque
stringData:
  DATABASE_URL: postgres://postgres:postgres@postgres-rw.masters-pool.svc.cluster.local:5432/golf_pool?sslmode=disable
  CLERK_SECRET_KEY: replace-me
  CLERK_JWKS_URL: https://your-clerk-domain/.well-known/jwks.json
  CLERK_ISSUER: https://your-clerk-domain
  CLERK_AUTHORIZED_PARTIES: https://masters-pool.example.com
  CLERK_EMAIL_CLAIM: email
  CLERK_NAME_CLAIM: name
  CLERK_ADMIN_CLAIM: role
  CLERK_ADMIN_VALUE: admin
  GOLF_API_KEY: replace-me
